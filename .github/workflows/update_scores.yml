name: Update Daily Exact Scores

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (1:00 PM Nigeria time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fix DNS resolution on runner
        run: |
          sudo bash -c 'echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" > /etc/resolv.conf'

      - name: Run all scripts and save JSONs into outputs folder
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          mkdir -p outputs
          cd outputs
          python ../scripts/fetch_scores.py
          python ../scripts/high_goals.py
          python ../scripts/draws.py
          python ../scripts/ht_goals.py
          python ../scripts/high_odds_sports.py
          python ../scripts/sportmonks_high_odds.py
          python ../scripts/htft_comebacks.py
          python ../scripts/top3_sports.py

      - name: Commit all updated JSON files in outputs folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add outputs/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily JSON outputs"
          git push

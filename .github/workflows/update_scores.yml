name: Update Daily Exact Scores

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (1:00 PM Nigeria time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fix DNS resolution on runner
        run: |
          sudo bash -c 'echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" > /etc/resolv.conf'

      - name: Run all exact score and high odds scripts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python fetch_scores.py
          python high_goals.py
          python draws.py
          python ht_goals.py
          python high_odds_sports.py
          python sportmonks_high_odds.py

      - name: Commit all updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json high_goals.json draws.json ht_goals.json high_odds_sports.json sportmonks_high_odds.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily scores, high goals, draws, HT goals, and high odds sports"
          git push

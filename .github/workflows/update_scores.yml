name: Update Daily Exact Scores

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (1:00 PM Nigeria time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fix DNS resolution on runner
        run: |
          sudo bash -c 'echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" > /etc/resolv.conf'

      - name: Run all scripts safely and save JSONs into outputs folder
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          mkdir -p outputs
          cd outputs
          for file in fetch_scores.py high_goals.py draws.py ht_goals.py high_odds_sports.py sportmonks_high_odds.py htft_comebacks.py top3_sports.py; do
            if [ -f "../scripts/$file" ]; then
              python "../scripts/$file" || true
            elif [ -f "../$file" ]; then
              python "../$file" || true
            fi
          done
          cp -f ../*.json . 2>/dev/null || true

      - name: Commit all updated JSON files in outputs folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/*.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily JSON outputs"
          git push
